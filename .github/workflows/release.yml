name: Preview release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check version and release notes
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid version' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match VERSION' }
          if (!(Test-Path -LiteralPath "docs/releases/v$version.md")) { throw 'Release notes are missing' }
      - name: Validate repository and native helper
        run: |
          .\scripts\Validate-Repository.ps1
          Add-Type -Path .\src\DesktopWallpaper.cs
      - name: Test backup and reset with simulated desktop calls
        run: .\tests\Test.ps1
      - name: Build Starter package and verify extracted contents
        run: |
          .\scripts\Package.ps1
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          .\tests\Test-Package.ps1 -PackagePath $zip.FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cozy-desktop-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Create a draft preview with downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $existing = gh release view $tag --json isDraft --jq .isDraft 2>$null
            $exists = $LASTEXITCODE -eq 0
          } finally { $ErrorActionPreference = $previousPreference }
          if ($exists) {
            if ($existing -ne 'true') { throw 'Refusing to overwrite a published release' }
          } else {
            gh release create $tag --draft --prerelease --target $env:GITHUB_SHA --title "Cozy Desktop $version (Starter preview)" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = Get-ChildItem dist -File | Where-Object Extension -in '.zip','.sha256'
          gh release upload $tag $assets.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
